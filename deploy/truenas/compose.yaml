# ---------------------------------------------------------------------------
# Parlay Projector — TrueNAS SCALE Custom App
#
# Paste the contents of this file into:
#   Apps -> Discover Apps -> Custom App -> Install via YAML
#
# TrueNAS Custom App name: parlayprojector
# (TrueNAS strips the hyphen; the service name below is unaffected.)
#
# This consumes the image already built and published by GitHub Actions.
# There is deliberately no `build:` key — TrueNAS never compiles the app, and
# no application source is ever copied onto the NAS.
#
# Image namespace: j1-hypz (GHCR requires the owner in lowercase).
# ---------------------------------------------------------------------------
services:
  parlay-projector:
    image: ghcr.io/j1-hypz/parlay-projector:latest

    # Pin to a commit SHA tag instead of `latest` to roll back, e.g.
    #   image: ghcr.io/j1-hypz/parlay-projector:a38d21f

    restart: unless-stopped

    # Forward SIGTERM properly so redeploys stop the app cleanly.
    init: true

    environment:
      # Port the server listens on inside the container.
      PORT: "3000"
      # Must stay 0.0.0.0 so the port is reachable from outside the container.
      HOST: "0.0.0.0"
      # The URL this app is actually reached on. Used for absolute
      # OpenGraph/metadata URLs. Change to your host or proxy hostname, e.g.
      #   http://truenas.lan:3000
      #   https://parlay.example.com
      SITE_URL: "http://localhost:3000"

      # Timezone that decides which calendar day "today" is on the Home page.
      APP_TIMEZONE: "Europe/London"

      # Sports data provider key. Optional: defaults to TheSportsDB's public
      # test key, which is rate limited. Set a real key here for production.
      # SPORTS_API_KEY: "your-key"

      # Persistent data directory (prediction history). Must match the volume
      # mount below, or history is lost on every redeploy.
      DATA_DIR: "/data"

      # -------------------------------------------------------------------
      # Discord notifications
      # -------------------------------------------------------------------
      # THE WEBHOOK URL IS A CREDENTIAL. Anyone holding it can post to your
      # channel, and it cannot be revoked except by deleting the webhook in
      # Discord and creating a new one.
      #
      # Prefer setting it through the TrueNAS app's own environment editor
      # (Apps -> parlayprojector -> Edit -> Environment Variables) rather than
      # here, so it is not sitting in a YAML file you might paste or share.
      # If you do set it here, treat this file as secret and never commit it.
      #
      # Notifications are off entirely while this is unset.
      #
      # DISCORD_WEBHOOK_URL: "https://discord.com/api/webhooks/..."

      # Defaults only. Which events fire, how often, and a master on/off are all
      # editable on the app's Notifications page, which stores them on the
      # mounted volume and applies them within one poll. Set these if you want
      # different starting values.
      # NOTIFY_EVENTS: "kickoff,final"
      # NOTIFY_POLL_INTERVAL_MS: "300000"

      # Public origin, used only to link each Discord message to its game page.
      # Leave unset to send messages without links.
      # APP_BASE_URL: "http://truenas.lan:3000"

      # Only starred games are announced. Star them in the app; there is no
      # environment variable for the watchlist itself.

    ports:
      # host:container — change the host side if 3000 is already taken.
      - "3000:3000"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    volumes:
      # Prediction history lives here. The container filesystem is ephemeral,
      # so this MUST be a real host path or the data is lost on every redeploy.
      #
      # Replace <pool> with your apps pool. Create the dataset first and make it
      # writable by UID 1000 (the container's `node` user):
      #   sudo chown -R 1000:1000 /mnt/<pool>/parlay-projector/data
      #
      # See deploy/truenas/README.md section 9.
      - /mnt/<pool>/parlay-projector/data:/data

    # No database. Prediction history is a JSON file under /data; games and news
    # come from external providers and are cached in memory.
