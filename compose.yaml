# Local build-and-run for development testing.
#
# For TrueNAS SCALE use deploy/truenas/compose.yaml instead — that one pulls
# the pre-built image from GHCR rather than building from source.
services:
  parlay-projector:
    build:
      context: .
    image: parlay-projector:local
    environment:
      PORT: ${PORT:-3000}
      HOST: 0.0.0.0
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/London}
      SPORTS_API_KEY: ${SPORTS_API_KEY:-}
      DATA_DIR: /data
    volumes:
      - parlay-data:/data
    ports:
      - "${APP_PORT:-3000}:${PORT:-3000}"
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  parlay-data:
