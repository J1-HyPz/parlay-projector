name: Build and Publish

# Validates the project, then builds and publishes the production container.
#
#   push to main      -> validate, build image, publish to GHCR (latest + sha)
#   pull request       -> validate, build image, DO NOT publish
#   other branches     -> validate, build image, DO NOT publish
#
# Only main can replace the `latest` tag, so a broken branch can never become
# the image TrueNAS pulls.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/parlay-projector

concurrency:
  group: build-and-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # Stage 1 — Validate. Nothing is built or published if this fails.
  # -------------------------------------------------------------------------
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reads the pinned version from package.json#packageManager.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Pinned to match the node:22-alpine base image in the Dockerfile.
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Hard gates from here on: a failure stops the pipeline and nothing is
      # published, so the running TrueNAS app is left untouched.
      #
      # Lint was report-only while the unused components/ui/ scaffolding carried
      # a backlog of findings. That tree is gone and the codebase is clean, so
      # lint blocks again — keep it that way.
      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Production build
        run: pnpm build

      # The container serves this exact artefact; if it is missing the
      # Dockerfile would fail later and less clearly.
      - name: Verify standalone output
        run: |
          if [ ! -f dist/standalone/server.js ]; then
            echo "::error::dist/standalone/server.js was not produced."
            echo "Check that next.config.ts still sets output: 'standalone'."
            exit 1
          fi
          echo "Standalone bundle present:"
          ls -la dist/standalone

  # -------------------------------------------------------------------------
  # Stage 2 — Build the image. Publishes to GHCR only from main.
  # -------------------------------------------------------------------------
  publish:
    name: Build Container and Publish GHCR
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only main publishes, so only main needs registry credentials.
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=
          labels: |
            org.opencontainers.image.title=Parlay Projector
            org.opencontainers.image.description=Parlay Projector by HyPz - multi-sport analytics interface

      # Build into the local daemon first so the image can be started and
      # exercised before anything is published.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: parlay-projector:ci
          build-args: |
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
            IMAGE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A published image that does not serve traffic is worse than no image,
      # so prove it boots and responds before pushing it.
      - name: Smoke test container
        run: |
          set -euo pipefail
          docker run -d --name pp-ci -p 3000:3000 -e PORT=3000 parlay-projector:ci

          echo "Waiting for /health ..."
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health -o /tmp/health.json; then
              ok=1
              break
            fi
            sleep 2
          done

          if [ "$ok" -ne 1 ]; then
            echo "::error::Container did not respond on /health within 60s"
            docker logs pp-ci
            docker rm -f pp-ci
            exit 1
          fi

          echo "/health -> $(cat /tmp/health.json)"

          # The dashboard must render, not just the health route.
          code=$(curl -s -o /tmp/home.html -w '%{http_code}' http://127.0.0.1:3000/)
          echo "GET / -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Home page returned HTTP $code"
            docker logs pp-ci
            docker rm -f pp-ci
            exit 1
          fi
          grep -q "Parlay Projector" /tmp/home.html \
            || { echo "::error::Home page did not contain expected content"; docker rm -f pp-ci; exit 1; }

          # Accuracy is fully deterministic and needs no external provider:
          # with no prediction history it must report the empty state rather
          # than a fabricated percentage.
          acc=$(curl -fsS http://127.0.0.1:3000/api/home/accuracy) || {
            echo "::error::/api/home/accuracy did not respond"; docker logs pp-ci; docker rm -f pp-ci; exit 1; }
          echo "/api/home/accuracy -> $acc"
          echo "$acc" | grep -q '"accuracy":null' \
            || { echo "::error::expected the empty accuracy state in a fresh container"; docker rm -f pp-ci; exit 1; }

          # Invalid input must be rejected, not passed through to a provider.
          bad=$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:3000/api/home/games?sport=bogus')
          echo "GET /api/home/games?sport=bogus -> HTTP $bad"
          [ "$bad" = "400" ] \
            || { echo "::error::invalid sport should return 400, got $bad"; docker rm -f pp-ci; exit 1; }

          # Dynamic game route must render on a direct request, not only after
          # client-side navigation from the homepage.
          game=$(curl -s -o /tmp/game.html -w '%{http_code}' http://127.0.0.1:3000/games/2398051)
          echo "GET /games/2398051 -> HTTP $game"
          [ "$game" = "200" ] \
            || { echo "::error::dynamic game route failed on direct request, got $game"; docker logs pp-ci; docker rm -f pp-ci; exit 1; }
          grep -q "Parlay Projector" /tmp/game.html \
            || { echo "::error::game page did not render the app shell"; docker rm -f pp-ci; exit 1; }

          # Schedule renders on a direct request and always reports an
          # eight-date window, even when every provider call is rate limited.
          sched=$(curl -s -o /tmp/sched.html -w '%{http_code}' --max-time 90 http://127.0.0.1:3000/schedule)
          echo "GET /schedule -> HTTP $sched"
          [ "$sched" = "200" ]             || { echo "::error::schedule page failed, got $sched"; docker logs pp-ci; docker rm -f pp-ci; exit 1; }

          api=$(curl -s --max-time 90 http://127.0.0.1:3000/api/schedule) || {
            echo "::error::/api/schedule did not respond"; docker logs pp-ci; docker rm -f pp-ci; exit 1; }
          # `|| true`: a grep with no matches exits 1, which under `set -o
          # pipefail` would abort here instead of reporting the real problem.
          dates=$(printf '%s' "$api" | grep -o '[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}' | sort -u | wc -l || true)
          echo "/api/schedule -> $dates distinct dates"
          if [ "$dates" != "8" ]; then
            echo "::error::expected an 8-date schedule window, got $dates"
            docker rm -f pp-ci
            exit 1
          fi

          # An `if` rather than `grep && {...}`: under `set -e` the && form
          # aborts the script on the success path, when grep finds nothing.
          if printf '%s' "$api" | grep -q '"odds"\|"moneyline"\|"spread"\|"bookmaker"'; then
            echo "::error::schedule response contained betting fields"
            docker rm -f pp-ci
            exit 1
          fi
          echo "schedule response contains no betting fields"

          # An unknown or malformed id is a 404, not a crash.
          for bad_id in 99999999999 not-a-number; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000/api/games/$bad_id")
            echo "GET /api/games/$bad_id -> HTTP $code"
            [ "$code" = "404" ] \
              || { echo "::error::expected 404 for game id '$bad_id', got $code"; docker rm -f pp-ci; exit 1; }
          done

          # Confirm the container is not running as root.
          whoami_out=$(docker exec pp-ci id -un)
          echo "Container user: $whoami_out"
          if [ "$whoami_out" = "root" ]; then
            echo "::error::Container is running as root"
            docker rm -f pp-ci
            exit 1
          fi

          size=$(docker image inspect parlay-projector:ci --format '{{.Size}}')
          echo "Image size: $(( size / 1024 / 1024 )) MB"

          docker rm -f pp-ci
          {
            echo "### Container smoke test: passed"
            echo
            echo "- \`GET /health\` → \`$(cat /tmp/health.json)\`"
            echo "- \`GET /\` → HTTP $code"
            echo "- Runs as \`$whoami_out\` (non-root)"
            echo "- Image size: $(( size / 1024 / 1024 )) MB"
          } >> "$GITHUB_STEP_SUMMARY"

      # Only now, and only from main, does the image reach GHCR.
      # Layers are already cached, so this re-uses the tested build.
      - name: Push to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
            IMAGE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Container image"
            echo
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "Built, smoke-tested and published to GHCR:"
            else
              echo "Built and smoke-tested, **not** published (only \`main\` publishes):"
            fi
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
