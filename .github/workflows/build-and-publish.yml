name: Build and Publish

# Validates the project, then builds and publishes the production container.
#
#   push to main      -> validate, build image, publish to GHCR (latest + sha)
#   pull request       -> validate, build image, DO NOT publish
#   other branches     -> validate, build image, DO NOT publish
#
# Only main can replace the `latest` tag, so a broken branch can never become
# the image TrueNAS pulls.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/parlay-projector

concurrency:
  group: build-and-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # Stage 1 — Validate. Nothing is built or published if this fails.
  # -------------------------------------------------------------------------
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reads the pinned version from package.json#packageManager.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Pinned to match the node:22-alpine base image in the Dockerfile.
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Hard gates from here on: a failure stops the pipeline and nothing is
      # published, so the running TrueNAS app is left untouched.
      #
      # Lint was report-only while the unused components/ui/ scaffolding carried
      # a backlog of findings. That tree is gone and the codebase is clean, so
      # lint blocks again — keep it that way.
      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Production build
        run: pnpm build

      # The container serves this exact artefact; if it is missing the
      # Dockerfile would fail later and less clearly.
      - name: Verify standalone output
        run: |
          if [ ! -f dist/standalone/server.js ]; then
            echo "::error::dist/standalone/server.js was not produced."
            echo "Check that next.config.ts still sets output: 'standalone'."
            exit 1
          fi
          echo "Standalone bundle present:"
          ls -la dist/standalone

  # -------------------------------------------------------------------------
  # Stage 2 — Build the image. Publishes to GHCR only from main.
  # -------------------------------------------------------------------------
  publish:
    name: Build Container and Publish GHCR
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only main publishes, so only main needs registry credentials.
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=
          labels: |
            org.opencontainers.image.title=Parlay Projector
            org.opencontainers.image.description=Parlay Projector by HyPz - multi-sport analytics interface

      # Build into the local daemon first so the image can be started and
      # exercised before anything is published.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: parlay-projector:ci
          build-args: |
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
            IMAGE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A published image that does not serve traffic is worse than no image,
      # so prove it boots and responds before pushing it.
      - name: Smoke test container
        run: |
          set -euo pipefail
          docker run -d --name pp-ci -p 3000:3000 -e PORT=3000 parlay-projector:ci

          echo "Waiting for /health ..."
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health -o /tmp/health.json; then
              ok=1
              break
            fi
            sleep 2
          done

          if [ "$ok" -ne 1 ]; then
            echo "::error::Container did not respond on /health within 60s"
            docker logs pp-ci
            docker rm -f pp-ci
            exit 1
          fi

          echo "/health -> $(cat /tmp/health.json)"

          # The dashboard must render, not just the health route.
          code=$(curl -s -o /tmp/home.html -w '%{http_code}' http://127.0.0.1:3000/)
          echo "GET / -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Home page returned HTTP $code"
            docker logs pp-ci
            docker rm -f pp-ci
            exit 1
          fi
          grep -q "Parlay Projector" /tmp/home.html \
            || { echo "::error::Home page did not contain expected content"; docker rm -f pp-ci; exit 1; }

          # Accuracy is fully deterministic and needs no external provider:
          # with no prediction history it must report the empty state rather
          # than a fabricated percentage.
          acc=$(curl -fsS http://127.0.0.1:3000/api/home/accuracy) || {
            echo "::error::/api/home/accuracy did not respond"; docker logs pp-ci; docker rm -f pp-ci; exit 1; }
          echo "/api/home/accuracy -> $acc"
          echo "$acc" | grep -q '"accuracy":null' \
            || { echo "::error::expected the empty accuracy state in a fresh container"; docker rm -f pp-ci; exit 1; }

          # Invalid input must be rejected, not passed through to a provider.
          bad=$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:3000/api/home/games?sport=bogus')
          echo "GET /api/home/games?sport=bogus -> HTTP $bad"
          [ "$bad" = "400" ] \
            || { echo "::error::invalid sport should return 400, got $bad"; docker rm -f pp-ci; exit 1; }

          # Dynamic game route must render on a direct request, not only after
          # client-side navigation from the homepage.
          game=$(curl -s -o /tmp/game.html -w '%{http_code}' http://127.0.0.1:3000/games/2398051)
          echo "GET /games/2398051 -> HTTP $game"
          [ "$game" = "200" ] \
            || { echo "::error::dynamic game route failed on direct request, got $game"; docker logs pp-ci; docker rm -f pp-ci; exit 1; }
          grep -q "Parlay Projector" /tmp/game.html \
            || { echo "::error::game page did not render the app shell"; docker rm -f pp-ci; exit 1; }

          # The projection engine, end to end against live provider data. The
          # unit tests run on synthetic seasons where the answer is known; this
          # is the only place the whole pipeline runs on real fixtures.
          python3 scripts/verify-projections.py http://127.0.0.1:3000 || {
            echo "::error::projection verification failed"; docker logs pp-ci; docker rm -f pp-ci; exit 1; }

          # The prediction accuracy system, end to end: generate a real line,
          # confirm its legs are stored and tracked, confirm settlement is
          # idempotent, and confirm the homepage widget is the same number the
          # accuracy service reports.
          python3 scripts/verify-accuracy.py http://127.0.0.1:3000 || {
            echo "::error::accuracy verification failed"; docker logs pp-ci; docker rm -f pp-ci; exit 1; }

          # The tracker must have logged its own start-up. Independent of the
          # endpoint above: this proves the instrumentation hook fired inside
          # the standalone server, which is what makes the whole thing run.
          if ! docker logs pp-ci 2>&1 | grep -q 'settlement_started'; then
            echo "::error::the prediction tracker never started"
            docker logs pp-ci | tail -40
            docker rm -f pp-ci
            exit 1
          fi
          echo "prediction tracker started inside the container"


          # An unknown risk level is rejected rather than passed through.
          bad_risk=$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:3000/api/parlays?risk=guaranteed')
          echo "GET /api/parlays?risk=guaranteed -> HTTP $bad_risk"
          [ "$bad_risk" = "400" ]             || { echo "::error::an unknown risk level should be 400, got $bad_risk"; docker rm -f pp-ci; exit 1; }

          # Parlays renders, and carries none of the language this system must
          # never use about a statistical estimate.
          par=$(curl -s -o /tmp/parlays.html -w '%{http_code}' --max-time 180 http://127.0.0.1:3000/parlays)
          echo "GET /parlays -> HTTP $par"
          [ "$par" = "200" ]             || { echo "::error::parlays page failed, got $par"; docker logs pp-ci; docker rm -f pp-ci; exit 1; }
          if grep -qiE "guaranteed|100% lock|safe bet|sure thing|bookmaker|sportsbook" /tmp/parlays.html; then
            echo "::error::Parlays page contains language this system must never use"
            docker rm -f pp-ci
            exit 1
          fi

          # The competition index is the only route to a hub on mobile, where
          # the sidebar is hidden.
          idx=$(curl -s -o /tmp/sports.html -w '%{http_code}' --max-time 90 http://127.0.0.1:3000/sports)
          echo "GET /sports -> HTTP $idx"
          [ "$idx" = "200" ]             || { echo "::error::competition index failed, got $idx"; docker logs pp-ci; docker rm -f pp-ci; exit 1; }
          for expect in "NBA" "Premier League" "NCAA Basketball" "Serie A"; do
            grep -q "$expect" /tmp/sports.html               || { echo "::error::/sports did not list \"$expect\""; docker rm -f pp-ci; exit 1; }
          done

          # Every competition hub renders on a direct request. One dynamic
          # route serves all sixteen, so a representative slug per shape is
          # enough: a plain league, a football competition, and the combined
          # NCAA grouping that is not a registry id at all.
          for hub in "nba:NBA" "epl:Premier League" "ncaab:NCAA Basketball" "ncaam:NCAA Basketball"; do
            slug="${hub%%:*}"
            expect="${hub#*:}"
            code=$(curl -s -o /tmp/hub.html -w '%{http_code}' --max-time 90 "http://127.0.0.1:3000/sports/$slug")
            echo "GET /sports/$slug -> HTTP $code"
            [ "$code" = "200" ]               || { echo "::error::hub /sports/$slug failed, got $code"; docker logs pp-ci; docker rm -f pp-ci; exit 1; }
            grep -q "$expect" /tmp/hub.html               || { echo "::error::/sports/$slug did not render \"$expect\""; docker rm -f pp-ci; exit 1; }
          done

          # The competitions served by TheSportsDB rather than ESPN. Their hubs
          # must render, and their capability flags must match what that
          # provider actually publishes.
          for hub in "cfl:CFL" "afle:American Football League Europe" "efa:European Football Alliance"; do
            slug="${hub%%:*}"
            expect="${hub#*:}"
            code=$(curl -s -o /tmp/sdb.html -w '%{http_code}' --max-time 120 "http://127.0.0.1:3000/sports/$slug")
            echo "GET /sports/$slug -> HTTP $code"
            [ "$code" = "200" ]               || { echo "::error::hub /sports/$slug failed, got $code"; docker logs pp-ci; docker rm -f pp-ci; exit 1; }
            grep -q "$expect" /tmp/sdb.html               || { echo "::error::/sports/$slug did not render \"$expect\""; docker rm -f pp-ci; exit 1; }

            # Neither news nor transactions is published for these, and both
            # must say so rather than erroring.
            for endpoint in games news transactions; do
              c=$(curl -s -o /tmp/sdb.json -w '%{http_code}' --max-time 120 "http://127.0.0.1:3000/api/leagues/$slug/$endpoint")
              [ "$c" = "200" ]                 || { echo "::error::/api/leagues/$slug/$endpoint returned $c"; docker rm -f pp-ci; exit 1; }
            done
            grep -q '"supported":false' /tmp/sdb.json               || { echo "::error::$slug should report transactions unsupported"; docker rm -f pp-ci; exit 1; }
            echo "  $slug: hub renders, endpoints answer, transactions unsupported"
          done

          # An unlisted competition is a 404, not an empty page. `tennis` is the
          # case that matters: the shared SportId type still contains it, but no
          # verified tennis competition exists in the catalogue.
          for missing in tennis rugby nonsense; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "http://127.0.0.1:3000/sports/$missing")
            echo "GET /sports/$missing -> HTTP $code"
            [ "$code" = "404" ]               || { echo "::error::/sports/$missing should be 404, got $code"; docker rm -f pp-ci; exit 1; }
          done

          # The new league endpoints answer, and reject an unknown league.
          for endpoint in games news transactions; do
            code=$(curl -s -o /tmp/league.json -w '%{http_code}' --max-time 90 "http://127.0.0.1:3000/api/leagues/nba/$endpoint")
            echo "GET /api/leagues/nba/$endpoint -> HTTP $code"
            [ "$code" = "200" ]               || { echo "::error::/api/leagues/nba/$endpoint failed, got $code"; docker rm -f pp-ci; exit 1; }

            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "http://127.0.0.1:3000/api/leagues/bogus/$endpoint")
            [ "$code" = "404" ]               || { echo "::error::unknown league on $endpoint should be 404, got $code"; docker rm -f pp-ci; exit 1; }
          done

          # Football publishes no transactions, and that must be reported as
          # unsupported rather than as an empty week.
          transfers=$(curl -fsS --max-time 90 http://127.0.0.1:3000/api/leagues/epl/transactions) || {
            echo "::error::/api/leagues/epl/transactions did not respond"; docker rm -f pp-ci; exit 1; }
          printf '%s' "$transfers" | grep -q '"supported":false'             || { echo "::error::expected epl transactions to report supported:false"; docker rm -f pp-ci; exit 1; }

          # The pages that existed before the hubs must still render.
          for route in /live /parlays /notifications; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "http://127.0.0.1:3000$route")
            echo "GET $route -> HTTP $code"
            [ "$code" = "200" ]               || { echo "::error::$route regressed, got $code"; docker logs pp-ci; docker rm -f pp-ci; exit 1; }
          done

          # Schedule renders on a direct request and always reports an
          # eight-date window, even when every provider call is rate limited.
          sched=$(curl -s -o /tmp/sched.html -w '%{http_code}' --max-time 90 http://127.0.0.1:3000/schedule)
          echo "GET /schedule -> HTTP $sched"
          [ "$sched" = "200" ]             || { echo "::error::schedule page failed, got $sched"; docker logs pp-ci; docker rm -f pp-ci; exit 1; }

          api=$(curl -s --max-time 90 http://127.0.0.1:3000/api/schedule) || {
            echo "::error::/api/schedule did not respond"; docker logs pp-ci; docker rm -f pp-ci; exit 1; }
          # Count the `dates` array specifically, not every date-shaped string
          # in the payload - game start times are dates too.
          # `|| true`: a grep with no matches exits 1, which under `set -o
          # pipefail` would abort here instead of reporting the real problem.
          dates=$(printf '%s' "$api"             | grep -o '"dates":\[[^]]*\]'             | grep -o '[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}'             | sort -u | wc -l || true)
          echo "/api/schedule -> $dates dates in the window"
          if [ "$dates" != "8" ]; then
            echo "::error::expected an 8-date schedule window, got $dates"
            docker rm -f pp-ci
            exit 1
          fi

          # An `if` rather than `grep && {...}`: under `set -e` the && form
          # aborts the script on the success path, when grep finds nothing.
          if printf '%s' "$api" | grep -q '"odds"\|"moneyline"\|"spread"\|"bookmaker"'; then
            echo "::error::schedule response contained betting fields"
            docker rm -f pp-ci
            exit 1
          fi
          echo "schedule response contains no betting fields"

          # Live must respond with the documented shape whether or not any
          # games are in progress.
          live=$(curl -s --max-time 60 http://127.0.0.1:3000/api/live) || {
            echo "::error::/api/live did not respond"; docker logs pp-ci; docker rm -f pp-ci; exit 1; }
          printf '%s' "$live" | head -c 200
          echo
          for field in '"updated_at"' '"refresh_interval_ms"' '"games"' '"upcoming"'; do
            if ! printf '%s' "$live" | grep -q "$field"; then
              echo "::error::/api/live response missing $field"
              docker rm -f pp-ci
              exit 1
            fi
          done
          if printf '%s' "$live" | grep -q '"odds"\|"moneyline"\|"spread"\|"bookmaker"\|"prediction"'; then
            echo "::error::live response contained betting or prediction fields"
            docker rm -f pp-ci
            exit 1
          fi
          echo "live response shape ok, no betting or prediction fields"

          livepage=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 http://127.0.0.1:3000/live)
          echo "GET /live -> HTTP $livepage"
          [ "$livepage" = "200" ]             || { echo "::error::live page failed, got $livepage"; docker rm -f pp-ci; exit 1; }

          # League catalogue must list the professional and collegiate leagues.
          lg=$(curl -s --max-time 30 http://127.0.0.1:3000/api/leagues) || {
            echo "::error::/api/leagues did not respond"; docker rm -f pp-ci; exit 1; }
          for id in nfl ncaaf nba wnba ncaam ncaaw epl; do
            if ! printf '%s' "$lg" | grep -q "\"$id\""; then
              echo "::error::league '$id' missing from the catalogue"
              docker rm -f pp-ci
              exit 1
            fi
          done
          echo "league catalogue lists all requested competitions"

          # An unknown league is a 404, not a passthrough to the provider.
          code=$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:3000/api/leagues/nope/standings')
          echo "GET /api/leagues/nope/standings -> HTTP $code"
          if [ "$code" != "404" ]; then
            echo "::error::an unknown league must return 404, got $code"
            docker rm -f pp-ci
            exit 1
          fi

          # Provider diagnostics must report the registry and leak no secrets.
          prov=$(curl -s --max-time 30 http://127.0.0.1:3000/api/internal/providers) || {
            echo "::error::/api/internal/providers did not respond"; docker rm -f pp-ci; exit 1; }
          echo "providers -> $(printf '%s' "$prov" | head -c 200)"
          for id in thesportsdb espn rss; do
            if ! printf '%s' "$prov" | grep -q "\"$id\""; then
              echo "::error::provider '$id' missing from diagnostics"
              docker rm -f pp-ci
              exit 1
            fi
          done
          if printf '%s' "$prov" | grep -qiE '"(api_?key|password|token|secret)"[[:space:]]*:[[:space:]]*"[^"]+'; then
            echo "::error::provider diagnostics leaked a credential"
            docker rm -f pp-ci
            exit 1
          fi
          echo "provider diagnostics ok, no credentials exposed"

          # A malformed id is rejected before any provider call, so it is
          # always a 404.
          code=$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:3000/api/games/not-a-number')
          echo "GET /api/games/not-a-number -> HTTP $code"
          if [ "$code" != "404" ]; then
            echo "::error::a malformed game id must return 404, got $code"
            docker rm -f pp-ci
            exit 1
          fi

          # A well-formed but unknown id does reach the provider, so 503 is a
          # legitimate answer when the provider is rate limited or down. Both
          # are correct; a 200 or a crash is not.
          code=$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:3000/api/games/99999999999')
          echo "GET /api/games/99999999999 -> HTTP $code"
          if [ "$code" != "404" ] && [ "$code" != "503" ]; then
            echo "::error::expected 404 (unknown) or 503 (provider unavailable), got $code"
            docker logs pp-ci
            docker rm -f pp-ci
            exit 1
          fi

          # Confirm the container is not running as root.
          whoami_out=$(docker exec pp-ci id -un)
          echo "Container user: $whoami_out"
          if [ "$whoami_out" = "root" ]; then
            echo "::error::Container is running as root"
            docker rm -f pp-ci
            exit 1
          fi

          size=$(docker image inspect parlay-projector:ci --format '{{.Size}}')
          echo "Image size: $(( size / 1024 / 1024 )) MB"

          docker rm -f pp-ci
          {
            echo "### Container smoke test: passed"
            echo
            echo "- \`GET /health\` → \`$(cat /tmp/health.json)\`"
            echo "- \`GET /\` → HTTP $code"
            echo "- Runs as \`$whoami_out\` (non-root)"
            echo "- Image size: $(( size / 1024 / 1024 )) MB"
          } >> "$GITHUB_STEP_SUMMARY"

      # Only now, and only from main, does the image reach GHCR.
      # Layers are already cached, so this re-uses the tested build.
      - name: Push to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
            IMAGE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Container image"
            echo
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "Built, smoke-tested and published to GHCR:"
            else
              echo "Built and smoke-tested, **not** published (only \`main\` publishes):"
            fi
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
