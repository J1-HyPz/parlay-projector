name: Build and Publish

# Validates the project, then builds and publishes the production container.
#
#   push to main      -> validate, build image, publish to GHCR (latest + sha)
#   pull request       -> validate, build image, DO NOT publish
#   other branches     -> validate, build image, DO NOT publish
#
# Only main can replace the `latest` tag, so a broken branch can never become
# the image TrueNAS pulls.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/parlay-projector

concurrency:
  group: build-and-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # Stage 1 — Validate. Nothing is built or published if this fails.
  # -------------------------------------------------------------------------
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reads the pinned version from package.json#packageManager.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Pinned to match the node:22-alpine base image in the Dockerfile.
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Report-only, deliberately.
      #
      # The project carries pre-existing oxlint findings (mostly jsx-a11y and
      # react-compiler rules inside the unused components/ui/ scaffolding, plus
      # a few in app code). They are code-quality debt, not build breakage, so
      # they are surfaced on every run without blocking deployment.
      #
      # Once the backlog is cleared, delete `continue-on-error` to make lint a
      # hard gate again.
      - name: Lint (report-only)
        id: lint
        continue-on-error: true
        run: pnpm lint

      - name: Report lint result
        if: always()
        run: |
          if [ "${{ steps.lint.outcome }}" = "success" ]; then
            echo "### Lint: clean" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Lint: findings present (not blocking)"
              echo
              echo "Pre-existing findings. See the **Lint (report-only)** step for detail."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Hard gates from here on: a failure stops the pipeline and nothing is
      # published, so the running TrueNAS app is left untouched.
      - name: Type check
        run: pnpm typecheck

      - name: Production build
        run: pnpm build

      # The container serves this exact artefact; if it is missing the
      # Dockerfile would fail later and less clearly.
      - name: Verify standalone output
        run: |
          if [ ! -f dist/standalone/server.js ]; then
            echo "::error::dist/standalone/server.js was not produced."
            echo "Check that next.config.ts still sets output: 'standalone'."
            exit 1
          fi
          echo "Standalone bundle present:"
          ls -la dist/standalone

  # -------------------------------------------------------------------------
  # Stage 2 — Build the image. Publishes to GHCR only from main.
  # -------------------------------------------------------------------------
  publish:
    name: Build Container and Publish GHCR
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only main publishes, so only main needs registry credentials.
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=
          labels: |
            org.opencontainers.image.title=Parlay Projector
            org.opencontainers.image.description=Parlay Projector by HyPz - multi-sport analytics interface

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
            IMAGE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Container image"
            echo
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "Published to GHCR:"
            else
              echo "Built but **not** published (only \`main\` publishes):"
            fi
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
